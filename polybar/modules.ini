[module/backlight]
type = internal/backlight
use-actual-brightness = false

format-padding = 1
format-prefix = %{T1}󰖨 %{T-}

label = %{T3}%percentage%%%{T-}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
low-at = 5

format-charging-padding = 1
format-charging-prefix = %{T1}󰠠 %{T-}

label-charging = %{T3}%percentage%%%{T-}

format-discharging-padding = 1
format-discharging-prefix = %{T1}󰠠 %{T-}

label-discharging = %{T3}%percentage%%%{T-}

format-full-padding = 1
format-full-prefix = %{T1}󰠠 %{T-}

label-full = %{T3}%percentage%%%{T-}

[module/border-round-left-blue]
type = custom/text

label = %{T2}%{T-}

[module/border-round-left]
type = custom/text

label = %{T2}%{T-}
label-foreground = ${colors.bg1}

[module/border-round-right-blue]
type = custom/text

label = %{T2}%{T-}

[module/border-round-right]
type = custom/text

label = %{T2}%{T-}
label-foreground = ${colors.bg1}

[module/bspwm]
type = internal/bspwm

format = <label-state> <label-mode>
format-padding = 1

label-focused = %{T1}󰄰 %{T-}

label-occupied = %{T1}󰄰 %{T-}

label-urgent = %{T1}󰄰 %{T-}

label-empty = %{T1}󰄰 %{T-}

label-locked = %{T1}󰍁 %{T-}

label-sticky = %{T1}󱍫 %{T-}

label-private = %{T1}󰒙 %{T-}

label-marked = %{T1}󰃃 %{T-}

[module/cpu]
type = internal/cpu
interval = 1

format-padding = 1
format-prefix = %{T1}󰍛 %{T-}

label = %{T3}%percentage:2%%%{T-}

[module/date]
type = internal/date
interval = 1

time = "%I:%M %p"
time-alt = "%d-%m-%Y"

format-padding = 1
format-prefix = %{T1}󱑎 %{T-}

label = %{T3}%time%%{T-}

[module/i3]
type = internal/i3

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false


format = <label-state>
format-font = 3

label-focused = 󱓇
label-focused-padding = 2

label-occupied = 󰚌
label-occupied-padding = 2

label-urgent = 󰚌
label-urgent-padding = 2

label-empty = 󰑊
label-empty-padding = 2

######################################################

[module/margin]
type = custom/text

label = %{T3} %{T-}
label-foreground = ${colors.full-trans}

[module/memory]
type = internal/memory
interval = 1

format-padding = 1
format-prefix = %{T1}󰘚 %{T-}

label = %{T3}%percentage_used%%%{T-}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume-padding = 1
format-volume-prefix = %{T1}󰕾 %{T-}

label-volume = %{T3}%percentage%%%{T-}
label-volume-foreground = ${colors.fg0}

format-muted-padding = 1
format-muted-prefix = %{T1}󰖁 %{T-}

label-muted = %{T3}%percentage%%%{T-}
label-muted-foreground = ${colors.fg0}

[module/title]
type = internal/xwindow

format = <label>
format-prefix = "󱂬 "
format-padding = 1

label = %{T3}%class%%{T-}

[module/tray]
type = internal/tray

format-padding = 1
tray-size = 60%
tray-spacing = 8px

[module/weather]
type = custom/script
interval = 1800

exec = python $POLYBAR_COLLECTION/scripts/weather/main.py

format-padding = 1
format-prefix = %{T1}󰖐 %{T-}

label = %{T3}%output%%{T-}

[module/wired]
type = internal/network
interface = ${env:POLYBAR_WIRED}
interval = 3.0

format-connected-padding = 1
format-connected-prefix = %{T1}󰒍 %{T-}

label-connected = %{T1} %{T-}%{T3}%downspeed%%{T-}

format-disconnected-padding = 1
format-disconnected-prefix = %{T1}󰒎 %{T-}

[module/wireless]
type = internal/network
interface = ${env:POLYBAR_WIRELESS}
interval = 3.0

format-connected-padding = 1
format-connected-prefix = %{T1}󰖩 %{T-}

label-connected = %{T1} %{T-}%{T3}%downspeed%%{T-}

format-disconnected-padding = 1
format-disconnected-prefix = %{T1}󰖪 %{T-}


[module/xbacklight]
type = internal/xbacklight

format-padding = 1
format-prefix = %{T1}󰖨 %{T-}

label = %{T3}%percentage%%%{T-}